services:
  gateway:
    image: spekoai/gateway:${SPEKO_GATEWAY_TAG:-latest}
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SPEKO_LOCAL_AUTH_TOKEN: ${SPEKO_LOCAL_AUTH_TOKEN:?set SPEKO_LOCAL_AUTH_TOKEN}
      SPEKO_API_KEY: ${SPEKO_API_KEY:-}
      SPEKO_ALIBABA_BYOK_API_KEY: ${SPEKO_ALIBABA_BYOK_API_KEY:-}
      SPEKO_ASSEMBLYAI_BYOK_API_KEY: ${SPEKO_ASSEMBLYAI_BYOK_API_KEY:-}
      SPEKO_CARTESIA_BYOK_API_KEY: ${SPEKO_CARTESIA_BYOK_API_KEY:-}
      SPEKO_DEEPGRAM_BYOK_API_KEY: ${SPEKO_DEEPGRAM_BYOK_API_KEY:-}
      SPEKO_ELEVENLABS_BYOK_API_KEY: ${SPEKO_ELEVENLABS_BYOK_API_KEY:-}
      SPEKO_FISH_BYOK_API_KEY: ${SPEKO_FISH_BYOK_API_KEY:-}
      SPEKO_GEMINI_BYOK_API_KEY: ${SPEKO_GEMINI_BYOK_API_KEY:-}
      SPEKO_GLADIA_BYOK_API_KEY: ${SPEKO_GLADIA_BYOK_API_KEY:-}
      SPEKO_GOOGLE_BYOK_ACCESS_TOKEN: ${SPEKO_GOOGLE_BYOK_ACCESS_TOKEN:-}
      SPEKO_GOOGLE_STT_ENDPOINT: ${SPEKO_GOOGLE_STT_ENDPOINT:-}
      SPEKO_GRADIUM_BYOK_API_KEY: ${SPEKO_GRADIUM_BYOK_API_KEY:-}
      SPEKO_HAMSA_BYOK_API_KEY: ${SPEKO_HAMSA_BYOK_API_KEY:-}
      SPEKO_HUME_BYOK_API_KEY: ${SPEKO_HUME_BYOK_API_KEY:-}
      SPEKO_INWORLD_BYOK_API_KEY: ${SPEKO_INWORLD_BYOK_API_KEY:-}
      SPEKO_MAYA_BYOK_API_KEY: ${SPEKO_MAYA_BYOK_API_KEY:-}
      SPEKO_META_BYOK_API_KEY: ${SPEKO_META_BYOK_API_KEY:-}
      SPEKO_MINIMAX_BYOK_API_KEY: ${SPEKO_MINIMAX_BYOK_API_KEY:-}
      SPEKO_MODULATE_BYOK_API_KEY: ${SPEKO_MODULATE_BYOK_API_KEY:-}
      SPEKO_OPENAI_BYOK_API_KEY: ${SPEKO_OPENAI_BYOK_API_KEY:-}
      SPEKO_PALABRA_BYOK_API_KEY: ${SPEKO_PALABRA_BYOK_API_KEY:-}
      SPEKO_RIME_BYOK_API_KEY: ${SPEKO_RIME_BYOK_API_KEY:-}
      SPEKO_SMALLEST_BYOK_API_KEY: ${SPEKO_SMALLEST_BYOK_API_KEY:-}
      SPEKO_SONIOX_BYOK_API_KEY: ${SPEKO_SONIOX_BYOK_API_KEY:-}
      SPEKO_SPEECHIFY_BYOK_API_KEY: ${SPEKO_SPEECHIFY_BYOK_API_KEY:-}
      SPEKO_SPEECHMATICS_BYOK_API_KEY: ${SPEKO_SPEECHMATICS_BYOK_API_KEY:-}
      SPEKO_XAI_BYOK_API_KEY: ${SPEKO_XAI_BYOK_API_KEY:-}
      SPEKO_ALIBABA_BYOK_TTS_VOICE: ${SPEKO_ALIBABA_BYOK_TTS_VOICE:-}
      SPEKO_CARTESIA_BYOK_TTS_VOICE: ${SPEKO_CARTESIA_BYOK_TTS_VOICE:-}
      SPEKO_DEEPGRAM_BYOK_TTS_VOICE: ${SPEKO_DEEPGRAM_BYOK_TTS_VOICE:-}
      SPEKO_ELEVENLABS_BYOK_TTS_VOICE: ${SPEKO_ELEVENLABS_BYOK_TTS_VOICE:-}
      SPEKO_FISH_BYOK_TTS_VOICE: ${SPEKO_FISH_BYOK_TTS_VOICE:-}
      SPEKO_GEMINI_BYOK_TTS_VOICE: ${SPEKO_GEMINI_BYOK_TTS_VOICE:-}
      SPEKO_GOOGLE_BYOK_TTS_VOICE: ${SPEKO_GOOGLE_BYOK_TTS_VOICE:-}
      SPEKO_GRADIUM_BYOK_TTS_VOICE: ${SPEKO_GRADIUM_BYOK_TTS_VOICE:-}
      SPEKO_HUME_BYOK_TTS_VOICE: ${SPEKO_HUME_BYOK_TTS_VOICE:-}
      SPEKO_INWORLD_BYOK_TTS_VOICE: ${SPEKO_INWORLD_BYOK_TTS_VOICE:-}
      SPEKO_MAYA_BYOK_TTS_VOICE: ${SPEKO_MAYA_BYOK_TTS_VOICE:-}
      SPEKO_MINIMAX_BYOK_TTS_VOICE: ${SPEKO_MINIMAX_BYOK_TTS_VOICE:-}
      SPEKO_OPENAI_BYOK_TTS_VOICE: ${SPEKO_OPENAI_BYOK_TTS_VOICE:-}
      SPEKO_PALABRA_BYOK_TTS_VOICE: ${SPEKO_PALABRA_BYOK_TTS_VOICE:-}
      SPEKO_RIME_BYOK_TTS_VOICE: ${SPEKO_RIME_BYOK_TTS_VOICE:-}
      SPEKO_SMALLEST_BYOK_TTS_VOICE: ${SPEKO_SMALLEST_BYOK_TTS_VOICE:-}
      SPEKO_SONIOX_BYOK_TTS_VOICE: ${SPEKO_SONIOX_BYOK_TTS_VOICE:-}
      SPEKO_SPEECHIFY_BYOK_TTS_VOICE: ${SPEKO_SPEECHIFY_BYOK_TTS_VOICE:-}
      SPEKO_XAI_BYOK_TTS_VOICE: ${SPEKO_XAI_BYOK_TTS_VOICE:-}
      SPEKO_TELEMETRY_DISABLED: ${SPEKO_TELEMETRY_DISABLED:-false}
    volumes:
      - speko-runtime:/run/speko
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    restart: unless-stopped

volumes:
  speko-runtime:
    name: speko-runtime
