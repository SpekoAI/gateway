name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/python
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv run --locked --extra dev ruff check .
      - run: uv run --locked --extra dev pytest

  python-livekit-floor:
    # The oldest livekit-agents the `livekit` extra admits; the job above runs
    # the locked version. livekit-agents before 1.6.10 declares an open
    # `openai>=2`, and openai 3 dropped the httpx it imports, so pin openai 2.
    # The extra itself stays uncapped: livekit-agents 1.8.7+ needs openai 3.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/python
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv venv
      - run: uv pip install -e . "livekit-agents==1.4.5" "openai>=2,<3" "pytest>=8" "pytest-asyncio>=0.24"
      - run: .venv/bin/python -m pytest

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: spekoai/gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
