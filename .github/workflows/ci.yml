name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv run --locked --extra dev ruff check .
      - run: uv run --locked --extra dev pytest

  python-livekit-floor:
    # The oldest livekit-agents the `livekit` extra admits; the job above runs
    # the locked version. A plain install with no extra and no openai pin, as
    # the image docs install it: livekit-agents before 1.6.10 imports httpx
    # without declaring it, openai 3 dropped it, and this package supplies it.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv venv
      - run: uv pip install -e . "livekit-agents==1.4.5" "livekit-plugins-silero==1.4.5" "pytest>=8" "pytest-asyncio>=0.24"
      - run: .venv/bin/python -m pytest

  python-livekit-retained-stream:
    # This release retains the native STT stream across Agent handoffs. The
    # floor and locked release alone do not exercise that lifecycle.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv venv
      # Exercise actual Silero buffering at both inference rates as well as
      # the SDK's local inference detector and retained-stream lifecycle.
      - run: uv pip install -e . "livekit-agents==1.8.10" "livekit-plugins-silero==1.8.10" "pytest>=8" "pytest-asyncio>=0.24"
      - run: .venv/bin/python -m pytest

  python-livekit-python310:
    # The Python package declares 3.10 support. Run retained-pipeline handoff
    # coverage there too, without changing the existing required job names.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv venv --python 3.10
      - run: uv pip install -e . "livekit-agents==1.8.10" "livekit-plugins-silero==1.8.10" "pytest>=8" "pytest-asyncio>=0.24"
      - run: .venv/bin/python -m pytest

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: spekoai/gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv run --locked --extra dev pytest -q tests/test_native_sidecar.py --native-gateway-image spekoai/gateway:ci
        working-directory: integrations/python
