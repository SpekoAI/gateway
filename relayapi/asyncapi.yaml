# json-mirror: asyncapi.json sha256:85a17eee9e2baafd16237020d0b3c012da85963d8060ae769045aade95d9f6d5
# yaml-body: sha256:2abbe0f8611367a1ac20a910a3e64c4c7cee6931f7dc07764f60ff8e4404dd60
#
# This YAML document is the hand-authored, human-readable source of the
# WebSocket contract. asyncapi.json is its checked-in JSON mirror: the same
# document, converted mechanically, because the in-repo spec checks
# (speccheck_test.go) parse JSON with the standard library rather than pulling
# in a YAML dependency. The MIRROR is the normative machine-checked document —
# every fixture and drift test reads asyncapi.json, never this file — and this
# YAML is the courtesy view for humans. The fingerprint header above forces
# the two to move together in one reviewable change, but it is a tripwire,
# not a semantic proof: a review that touches either file must confirm the
# other says the same thing. To change the contract, edit this file,
# regenerate the mirror, and refresh the two header hashes — the exact
# convention and a regeneration one-liner are documented in speccheck_test.go,
# and TestSpecMirrorFingerprints fails on any half-done edit.
asyncapi: "2.6.0"
info:
  title: Speko Router streaming API
  version: "1.0.0"
  description: >-
    WebSocket contract of the Speko Router: streaming speech-to-text and
    text-to-speech sessions. JSON text frames carry the control messages and
    events documented here; binary frames carry raw audio in the format the
    session.configure frame declared, with no JSON envelope. The Go types in
    package relayapi are the source of truth for every shape in this document,
    and speccheck_test.go machine-checks the two against each other. The HTTP
    endpoints are specified separately in openapi.yaml.
defaultContentType: application/json
servers:
  router:
    url: router.speko.dev
    protocol: wss
    description: >-
      Global entry point. The upgrade request authenticates with a
      Speko-issued bearer token and must carry an Idempotency-Key header. The
      idempotency content hash of a WebSocket session is the SHA-256 of the
      exact session.configure text-frame bytes, so a retry must reproduce the
      configure frame byte-for-byte; later frames are intentionally outside
      the hash — they are the stream's continuous content, guarded by budgets
      and leases, while the configure frame is the session's intent.
    security:
      - bearerAuth: []
channels:
  /v1/stt/stream:
    description: >-
      Streaming speech-to-text. The first text frame MUST be
      session.configure; its exact frame bytes are the session's idempotency
      content hash. Audio input travels in binary frames in the format the
      configure frame declared, and the client must not send audio before
      session.ready arrives. Exactly one terminal frame — session.closed or
      error — ends every session.
    bindings:
      ws:
        method: GET
        headers:
          type: object
          properties:
            Idempotency-Key:
              type: string
              minLength: 1
              maxLength: 256
              description: >-
                Required on the upgrade request. The Router persists only the
                key, a content hash, and the session's execution status —
                never the content itself. The hash covers the exact
                session.configure text-frame bytes; later frames are
                intentionally outside the hash. Reusing a key with the same
                hash while the original admission is still live returns
                request_in_progress (retryable); after dispatch it returns
                request_already_started with the original request id; reusing
                a key with a different hash returns idempotency_conflict.
                Keys are opaque, and the normative length bound is 256
                BYTES — maxLength below counts code points, which JSON
                Schema cannot avoid, so multi-byte keys hit the byte bound
                first.
          required:
            - Idempotency-Key
    publish:
      operationId: sendSTTFrames
      summary: Frames the client sends.
      description: >-
        JSON control frames, plus untyped binary frames carrying audio input.
      message:
        oneOf:
          - $ref: "#/components/messages/sttSessionConfigure"
          - $ref: "#/components/messages/sttInputCommit"
          - $ref: "#/components/messages/sttSessionClose"
          - $ref: "#/components/messages/sttAudioInput"
    subscribe:
      operationId: receiveSTTFrames
      summary: Frames the Router sends.
      description: >-
        session.ready is always the first event frame; exactly one terminal
        frame — session.closed or error — ends the session.
      message:
        oneOf:
          - $ref: "#/components/messages/sttSessionReady"
          - $ref: "#/components/messages/sttTranscriptDelta"
          - $ref: "#/components/messages/sttTranscriptFinal"
          - $ref: "#/components/messages/sttUsageUpdated"
          - $ref: "#/components/messages/sttSessionClosed"
          - $ref: "#/components/messages/wsError"
  /v1/tts/stream:
    description: >-
      Streaming text-to-speech. The first text frame MUST be
      session.configure; its exact frame bytes are the session's idempotency
      content hash. The client must not append text before session.ready
      arrives. Synthesized audio travels in binary frames between the
      utterance.started and utterance.done events that share its sequence
      number. Exactly one terminal frame — session.closed or error — ends
      every session.
    bindings:
      ws:
        method: GET
        headers:
          type: object
          properties:
            Idempotency-Key:
              type: string
              minLength: 1
              maxLength: 256
              description: >-
                Required on the upgrade request. The Router persists only the
                key, a content hash, and the session's execution status —
                never the content itself. The hash covers the exact
                session.configure text-frame bytes; later frames are
                intentionally outside the hash. Reusing a key with the same
                hash while the original admission is still live returns
                request_in_progress (retryable); after dispatch it returns
                request_already_started with the original request id; reusing
                a key with a different hash returns idempotency_conflict.
                Keys are opaque, and the normative length bound is 256
                BYTES — maxLength below counts code points, which JSON
                Schema cannot avoid, so multi-byte keys hit the byte bound
                first.
          required:
            - Idempotency-Key
    publish:
      operationId: sendTTSFrames
      summary: Frames the client sends.
      description: >-
        JSON control frames only; TTS clients never send binary frames.
      message:
        oneOf:
          - $ref: "#/components/messages/ttsSessionConfigure"
          - $ref: "#/components/messages/ttsInputAppend"
          - $ref: "#/components/messages/ttsInputCommit"
          - $ref: "#/components/messages/ttsInputCancel"
          - $ref: "#/components/messages/ttsSessionClose"
    subscribe:
      operationId: receiveTTSFrames
      summary: Frames the Router sends.
      description: >-
        session.ready is always the first event frame; exactly one terminal
        frame — session.closed or error — ends the session.
      message:
        oneOf:
          - $ref: "#/components/messages/ttsSessionReady"
          - $ref: "#/components/messages/ttsUtteranceStarted"
          - $ref: "#/components/messages/ttsAudioOutput"
          - $ref: "#/components/messages/ttsUtteranceDone"
          - $ref: "#/components/messages/ttsUsageUpdated"
          - $ref: "#/components/messages/ttsSessionClosed"
          - $ref: "#/components/messages/wsError"
  /v1/s2s/stream:
    description: >-
      Speech-to-speech. The first text frame MUST be session.configure; its
      exact frame bytes are the session's idempotency content hash. Audio
      input travels in binary frames in the declared input format, and the
      client must not send audio before session.ready arrives. Spoken answers
      travel in binary frames in the declared output format between the
      response.started and response.done (or response.cancelled) events that
      share their sequence number. The session is metered by connected
      wall-clock time. Exactly one terminal frame — session.closed or error —
      ends every session.
    bindings:
      ws:
        method: GET
        headers:
          type: object
          properties:
            Idempotency-Key:
              type: string
              minLength: 1
              maxLength: 256
              description: >-
                Required on the upgrade request. The Router persists only the
                key, a content hash, and the session's execution status —
                never the content itself. The hash covers the exact
                session.configure text-frame bytes; later frames are
                intentionally outside the hash. Reusing a key with the same
                hash while the original admission is still live returns
                request_in_progress (retryable); after dispatch it returns
                request_already_started with the original request id; reusing
                a key with a different hash returns idempotency_conflict.
                Keys are opaque, and the normative length bound is 256
                BYTES — maxLength below counts code points, which JSON
                Schema cannot avoid, so multi-byte keys hit the byte bound
                first.
          required:
            - Idempotency-Key
    publish:
      operationId: sendS2SFrames
      summary: Frames the client sends.
      description: >-
        JSON control frames, plus untyped binary frames carrying audio input.
      message:
        oneOf:
          - $ref: "#/components/messages/s2sSessionConfigure"
          - $ref: "#/components/messages/s2sInputCommit"
          - $ref: "#/components/messages/s2sResponseCancel"
          - $ref: "#/components/messages/s2sSessionClose"
          - $ref: "#/components/messages/s2sAudioInput"
    subscribe:
      operationId: receiveS2SFrames
      summary: Frames the Router sends.
      description: >-
        session.ready is always the first event frame; exactly one terminal
        frame — session.closed or error — ends the session.
      message:
        oneOf:
          - $ref: "#/components/messages/s2sSessionReady"
          - $ref: "#/components/messages/s2sInputSpeechStarted"
          - $ref: "#/components/messages/s2sInputSpeechEnded"
          - $ref: "#/components/messages/s2sInputTranscript"
          - $ref: "#/components/messages/s2sResponseStarted"
          - $ref: "#/components/messages/s2sResponseTranscriptDelta"
          - $ref: "#/components/messages/s2sAudioOutput"
          - $ref: "#/components/messages/s2sResponseDone"
          - $ref: "#/components/messages/s2sResponseCancelled"
          - $ref: "#/components/messages/s2sUsageUpdated"
          - $ref: "#/components/messages/s2sSessionClosed"
          - $ref: "#/components/messages/wsError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Speko-issued API credential presented as a bearer token on the upgrade
        request. Failures normalize to the authentication_failed error code.
  messages:
    sttSessionConfigure:
      name: session.configure
      title: STT session.configure
      summary: >-
        Opens a streaming transcription; must be the first text frame on the
        socket.
      payload:
        $ref: "#/components/schemas/STTSessionConfigure"
    sttInputCommit:
      name: input.commit
      title: STT input.commit
      summary: Marks the end of the audio the client wants finalized.
      payload:
        $ref: "#/components/schemas/STTInputCommit"
    sttSessionClose:
      name: session.close
      title: STT session.close
      summary: >-
        Asks the server to finish outstanding transcripts and end the session
        with a terminal session.closed frame.
      payload:
        $ref: "#/components/schemas/STTSessionClose"
    sttAudioInput:
      name: audio
      title: STT binary audio frame
      summary: >-
        One binary WebSocket frame of raw audio input in the format the
        session.configure frame declared. Binary frames are untyped: they
        carry no JSON envelope.
      contentType: application/octet-stream
      payload:
        type: string
        format: binary
    sttSessionReady:
      name: session.ready
      title: STT session.ready
      summary: >-
        Confirms admission and reports the concrete route; always the first
        event frame.
      payload:
        $ref: "#/components/schemas/STTSessionReady"
    sttTranscriptDelta:
      name: transcript.delta
      title: STT transcript.delta
      summary: An interim hypothesis, superseded by later frames.
      payload:
        $ref: "#/components/schemas/STTTranscriptDelta"
    sttTranscriptFinal:
      name: transcript.final
      title: STT transcript.final
      summary: A finalized span of transcript.
      payload:
        $ref: "#/components/schemas/STTTranscriptFinal"
    sttUsageUpdated:
      name: usage.updated
      title: STT usage.updated
      summary: Cumulative usage while the stream is live.
      payload:
        $ref: "#/components/schemas/STTUsageUpdated"
    sttSessionClosed:
      name: session.closed
      title: STT session.closed
      summary: The clean terminal frame carrying final usage.
      payload:
        $ref: "#/components/schemas/STTSessionClosed"
    ttsSessionConfigure:
      name: session.configure
      title: TTS session.configure
      summary: >-
        Opens a streaming synthesis session; must be the first text frame on
        the socket.
      payload:
        $ref: "#/components/schemas/TTSSessionConfigure"
    ttsInputAppend:
      name: input.append
      title: TTS input.append
      summary: Adds text to the utterance being assembled.
      payload:
        $ref: "#/components/schemas/TTSInputAppend"
    ttsInputCommit:
      name: input.commit
      title: TTS input.commit
      summary: >-
        Finalizes the appended text as one utterance and starts synthesis.
      payload:
        $ref: "#/components/schemas/TTSInputCommit"
    ttsInputCancel:
      name: input.cancel
      title: TTS input.cancel
      summary: >-
        Abandons uncommitted appended text and any in-flight synthesis for the
        current utterance.
      payload:
        $ref: "#/components/schemas/TTSInputCancel"
    ttsSessionClose:
      name: session.close
      title: TTS session.close
      summary: >-
        Asks the server to finish outstanding synthesis and end the session
        with a terminal session.closed frame.
      payload:
        $ref: "#/components/schemas/TTSSessionClose"
    ttsSessionReady:
      name: session.ready
      title: TTS session.ready
      summary: >-
        Confirms admission and reports the concrete route; always the first
        event frame.
      payload:
        $ref: "#/components/schemas/TTSSessionReady"
    ttsUtteranceStarted:
      name: utterance.started
      title: TTS utterance.started
      summary: Announces the binary audio frames for one committed utterance.
      payload:
        $ref: "#/components/schemas/TTSUtteranceStarted"
    ttsAudioOutput:
      name: audio
      title: TTS binary audio frame
      summary: >-
        One binary WebSocket frame of synthesized audio in the requested
        output format, sent between the utterance.started and utterance.done
        events that share its sequence number. Binary frames are untyped: they
        carry no JSON envelope.
      contentType: application/octet-stream
      payload:
        type: string
        format: binary
    ttsUtteranceDone:
      name: utterance.done
      title: TTS utterance.done
      summary: Marks the end of one utterance's binary audio frames.
      payload:
        $ref: "#/components/schemas/TTSUtteranceDone"
    ttsUsageUpdated:
      name: usage.updated
      title: TTS usage.updated
      summary: Cumulative usage while the stream is live.
      payload:
        $ref: "#/components/schemas/TTSUsageUpdated"
    ttsSessionClosed:
      name: session.closed
      title: TTS session.closed
      summary: The clean terminal frame carrying final usage.
      payload:
        $ref: "#/components/schemas/TTSSessionClosed"
    s2sSessionConfigure:
      name: session.configure
      title: S2S session.configure
      summary: >-
        Opens a speech-to-speech session; must be the first text frame on the
        socket.
      payload:
        $ref: "#/components/schemas/S2SSessionConfigure"
    s2sInputCommit:
      name: input.commit
      title: S2S input.commit
      summary: >-
        Tells the model the caller finished speaking. A hint: every routed
        model also detects turn ends on its own.
      payload:
        $ref: "#/components/schemas/S2SInputCommit"
    s2sResponseCancel:
      name: response.cancel
      title: S2S response.cancel
      summary: >-
        Interrupts the answer being spoken. Audio already delivered stays
        delivered.
      payload:
        $ref: "#/components/schemas/S2SResponseCancel"
    s2sSessionClose:
      name: session.close
      title: S2S session.close
      summary: Asks the server to end the session with a terminal session.closed frame.
      payload:
        $ref: "#/components/schemas/S2SSessionClose"
    s2sAudioInput:
      name: audio
      title: S2S binary audio input frame
      summary: >-
        One binary WebSocket frame of raw caller audio in the declared input
        format. Binary frames are untyped: they carry no JSON envelope.
      contentType: application/octet-stream
      payload:
        type: string
        format: binary
    s2sSessionReady:
      name: session.ready
      title: S2S session.ready
      summary: >-
        Confirms admission and reports the concrete route; always the first
        event frame.
      payload:
        $ref: "#/components/schemas/S2SSessionReady"
    s2sInputSpeechStarted:
      name: input.speech_started
      title: S2S input.speech_started
      summary: The model detected the caller speaking.
      payload:
        $ref: "#/components/schemas/S2SInputSpeechStarted"
    s2sInputSpeechEnded:
      name: input.speech_ended
      title: S2S input.speech_ended
      summary: The model detected the end of the caller's turn.
      payload:
        $ref: "#/components/schemas/S2SInputSpeechEnded"
    s2sInputTranscript:
      name: input.transcript
      title: S2S input.transcript
      summary: The model's transcription of what the caller said.
      payload:
        $ref: "#/components/schemas/S2SInputTranscript"
    s2sResponseStarted:
      name: response.started
      title: S2S response.started
      summary: Announces the binary audio frames of one spoken answer.
      payload:
        $ref: "#/components/schemas/S2SResponseStarted"
    s2sResponseTranscriptDelta:
      name: response.transcript.delta
      title: S2S response.transcript.delta
      summary: A piece of the text of the answer being spoken.
      payload:
        $ref: "#/components/schemas/S2SResponseTranscriptDelta"
    s2sAudioOutput:
      name: audio
      title: S2S binary audio output frame
      summary: >-
        One binary WebSocket frame of the spoken answer in the declared output
        format, sent between the response.started and response.done (or
        response.cancelled) events that share its sequence number. Binary
        frames are untyped: they carry no JSON envelope.
      contentType: application/octet-stream
      payload:
        type: string
        format: binary
    s2sResponseDone:
      name: response.done
      title: S2S response.done
      summary: Marks the end of one answer's binary audio frames.
      payload:
        $ref: "#/components/schemas/S2SResponseDone"
    s2sResponseCancelled:
      name: response.cancelled
      title: S2S response.cancelled
      summary: >-
        An answer stopped before it finished because the caller interrupted
        it; no response.done follows for that sequence.
      payload:
        $ref: "#/components/schemas/S2SResponseCancelled"
    s2sUsageUpdated:
      name: usage.updated
      title: S2S usage.updated
      summary: Cumulative usage while the session is live.
      payload:
        $ref: "#/components/schemas/S2SUsageUpdated"
    s2sSessionClosed:
      name: session.closed
      title: S2S session.closed
      summary: The clean terminal frame carrying final usage.
      payload:
        $ref: "#/components/schemas/S2SSessionClosed"
    wsError:
      name: error
      title: Terminal error frame
      summary: >-
        The terminal error frame, shared by STT, TTS and S2S sessions. The type
        name matches the SSE error event deliberately: one error vocabulary
        across every streaming transport.
      payload:
        $ref: "#/components/schemas/ErrorEvent"
  schemas:
    RoutingMode:
      type: string
      description: >-
        Discriminates the routing tagged union. The set is closed: an empty or
        unknown mode is rejected so a typo can never silently fall back to
        automatic provider selection.
      enum:
        - auto
        - explicit
    RoutingObjective:
      type: string
      description: >-
        Ranks auto-mode candidates. Unknown objectives are rejected rather
        than treated as balanced so callers learn about typos before any money
        is reserved.
      enum:
        - balanced
        - quality
        - latency
        - cost
    Routing:
      type: object
      description: >-
        Selects how the Router picks a provider for one session. It is a tagged
        union over mode: auto carries the objective and optional allow/deny
        provider filters, explicit carries exactly a provider and model.
        Fields from the other arm are rejected in both directions; a
        present-but-empty filter array ([]) counts as present and is rejected
        in explicit mode, while an empty-string provider or model in auto
        mode is indistinguishable from omission and tolerated as such. A
        wholly omitted routing object means {mode: auto, objective:
        balanced}, and an auto routing without an objective defaults to
        balanced — the default exists for omission, never for partially
        specified routing.

        Explicit mode also accepts the combined "provider/model" spelling in
        the model field: {"model": "openai/gpt-5.2"} with no provider splits
        at the first slash, and a model redundantly prefixed with the stated
        provider has the prefix stripped. Upstream model ids that themselves
        contain a slash must therefore name the provider one way or the
        other, e.g. "together/meta-llama/Llama-X" or provider "together"
        with model "meta-llama/Llama-X".
      properties:
        mode:
          $ref: "#/components/schemas/RoutingMode"
        objective:
          $ref: "#/components/schemas/RoutingObjective"
        allow_providers:
          type: array
          description: Auto mode only. Provider ids must not be blank.
          items:
            type: string
        deny_providers:
          type: array
          description: Auto mode only. Provider ids must not be blank.
          items:
            type: string
        provider:
          type: string
          description: Explicit mode only, and required there.
        model:
          type: string
          description: >-
            Explicit mode only, and required there. Accepts either the bare
            model id with the provider field set, or the combined
            "provider/model" form with the provider field omitted.
      additionalProperties: false
    Route:
      type: object
      description: >-
        The response-side counterpart of Routing: the concrete decision that
        served a session. region is the Speko Router location, not a
        provider-processing residency guarantee, and attempt_id identifies the
        (possibly post-fallback) attempt that produced the output.
      properties:
        provider:
          type: string
        model:
          type: string
        region:
          type: string
        attempt_id:
          type: string
      required:
        - provider
        - model
        - region
        - attempt_id
      additionalProperties: false
    AudioConfig:
      type: object
      description: >-
        Raw audio on a Router stream: the binary input frames of an STT
        session, or the synthesized output frames of a TTS session. The bounds
        match the local gateway's portable media contract so a caller can move
        between provider-direct and Router routes without re-encoding.
      properties:
        encoding:
          type: string
          enum:
            - pcm_s16le
            - opus
        sample_rate_hz:
          type: integer
          minimum: 8000
          maximum: 192000
        channels:
          type: integer
          minimum: 1
          maximum: 8
      required:
        - encoding
        - sample_rate_hz
        - channels
      additionalProperties: false
    Usage:
      type: object
      description: >-
        Normalized, provider-neutral quantities for one session. Only the
        lines relevant to the session's kind are set; zero lines are omitted
        on the wire. Split lines are mutually exclusive by contract: a token
        counted in cached_input_tokens is not repeated in input_tokens, and a
        reasoning token is not repeated in output_tokens, so the splits always
        sum to the totals.
      properties:
        duration_ms:
          type: integer
          minimum: 0
        characters:
          type: integer
          minimum: 0
        input_tokens:
          type: integer
          minimum: 0
        cached_input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        reasoning_tokens:
          type: integer
          minimum: 0
      additionalProperties: false
    TranscriptSegment:
      type: object
      description: One time-aligned span of the transcript.
      properties:
        text:
          type: string
        start_ms:
          type: integer
          minimum: 0
        end_ms:
          type: integer
          minimum: 0
          description: Must not precede start_ms.
        speaker:
          type: string
          description: >-
            Whoever said the span, present only when the request asked for
            diarization and the provider attributed it. The VENDOR's own
            label carried verbatim ("A" from one provider, "1" from
            another): renumbering across providers would invent an identity
            mapping no vendor promised. Absent means unattributed, which is
            not the same as a new speaker.
      required:
        - text
        - start_ms
        - end_ms
      additionalProperties: false
    ErrorCode:
      type: string
      description: >-
        Stable, machine-readable failure class. The set is closed: the Router
        normalizes every failure — including provider failures — to one of
        these codes and never forwards a raw provider response body. On an
        established WebSocket session the code arrives in a terminal error
        frame and no HTTP status applies; when the same code is returned over
        HTTP — including a rejected upgrade — it maps to one canonical
        status: 400 capability_unsupported and invalid_request; 401
        authentication_failed; 402 insufficient_credit; 404 route_not_found;
        405 method_not_allowed;
        409 idempotency_conflict,
        request_in_progress, and request_already_started; 413
        payload_too_large; 415 unsupported_media; 429 rate_limited and
        concurrency_exhausted; 500 relay_error; 502 provider_error; 503
        provider_unavailable; 504 request_timeout.
      enum:
        - authentication_failed
        - insufficient_credit
        - capability_unsupported
        - invalid_request
        - route_not_found
        - method_not_allowed
        - rate_limited
        - concurrency_exhausted
        - provider_error
        - provider_unavailable
        - relay_error
        - idempotency_conflict
        - request_in_progress
        - request_already_started
        - budget_exhausted
        - lease_expired
        - payload_too_large
        - unsupported_media
        - request_timeout
    ErrorBody:
      type: object
      description: >-
        The normalized failure detail. message is human-readable and
        intentionally carries no provider payload; request_id is present
        whenever a Router request id had been minted before the failure.
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        hint:
          type: string
          minLength: 1
          maxLength: 512
          pattern: "^[^\\r\\n]+$"
          description: Router-authored, single-line remediation that never contains provider payloads or customer content.
        retryable:
          type: boolean
        request_id:
          type: string
      required:
        - code
        - message
        - hint
        - retryable
      additionalProperties: false
    ErrorEvent:
      type: object
      description: >-
        The terminal error frame on a WebSocket session. Exactly one terminal
        frame — session.closed or error — ends every session.
      properties:
        type:
          type: string
          enum:
            - error
        error:
          $ref: "#/components/schemas/ErrorBody"
      required:
        - type
        - error
      additionalProperties: false
    STTSessionConfigure:
      type: object
      description: >-
        Opens a streaming transcription. audio describes the raw binary frames
        the client will send: streamed audio has no container, so the format
        must be declared up front. The exact frame bytes are the session's
        idempotency content hash; later frames are intentionally outside the
        hash.
      properties:
        type:
          type: string
          enum:
            - session.configure
        routing:
          $ref: "#/components/schemas/Routing"
          description: >-
            Omitted entirely, routing means {mode: auto, objective: balanced}.
        audio:
          $ref: "#/components/schemas/AudioConfig"
        language:
          type: string
          description: Optional language hint.
        options:
          $ref: "#/components/schemas/STTOptions"
          description: >-
            Transcription feature asks and per-provider settings for the whole
            session. They ride this frame — and therefore the session's
            idempotency hash — because they are session intent, not stream
            content: later frames cannot change them.
      required:
        - type
        - audio
      additionalProperties: false
    STTOptions:
      type: object
      description: >-
        What a caller asked a transcription to do beyond returning text. The
        same object rides POST /v1/stt/transcriptions and the STT
        session.configure frame, in the same vocabulary the local gateway
        uses. The canonical asks (diarization, keywords, noise_reduction)
        fail closed: a session whose routed model does not advertise the
        matching capability in GET /v1/models is rejected with
        capability_unsupported, never answered with the feature quietly
        missing. Names arrive lower case and are rejected otherwise rather
        than folded, because the idempotency content hash covers the
        configure frame bytes exactly as sent and one intent must have one
        spelling.
      properties:
        diarization:
          type: boolean
          description: >-
            Label each transcript segment with the speaker who said it.
            Omitted leaves the vendor default, which is not the same as false.
        keywords:
          type: array
          description: >-
            Vocabulary-biasing terms (names, products, jargon), translated to
            each vendor's own spelling. At most 100 terms of at most 64
            characters each; both bounds count CHARACTERS, which JSON Schema
            cannot express, so they are normative here in prose and enforced
            by the Router.
          items:
            type: string
        noise_reduction:
          type: boolean
          description: Ask the provider to clean the audio before transcribing.
        provider_options:
          type: object
          description: >-
            The vendor's OWN settings, namespaced by provider name, e.g.
            {"deepgram": {"numerals": true}}. Values are scalars only
            (boolean, number, or string of at most 256 characters). At most 8
            providers, each with at most 16 settings. Settings addressed to a
            provider the session does not reach are ignored by design, so
            they never narrow routing. The Router forwards only the keys the
            routed provider allow-lists and refuses the rest by name; keys it
            owns itself (model, language, encoding, sample_rate, credentials,
            and the canonical asks' own vendor spellings) are always refused.
          additionalProperties:
            type: object
            additionalProperties:
              oneOf:
                - type: boolean
                - type: number
                - type: string
      additionalProperties: false
    STTInputCommit:
      type: object
      description: Marks the end of the audio the client wants finalized.
      properties:
        type:
          type: string
          enum:
            - input.commit
      required:
        - type
      additionalProperties: false
    STTSessionClose:
      type: object
      description: >-
        Asks the server to finish outstanding transcripts and end the session
        with a terminal session.closed frame.
      properties:
        type:
          type: string
          enum:
            - session.close
      required:
        - type
      additionalProperties: false
    STTSessionReady:
      type: object
      description: >-
        Confirms admission and reports the concrete route. It is always the
        first event frame; the client must not send audio before it.
      properties:
        type:
          type: string
          enum:
            - session.ready
        request_id:
          type: string
        route:
          $ref: "#/components/schemas/Route"
      required:
        - type
        - request_id
        - route
      additionalProperties: false
    STTTranscriptDelta:
      type: object
      description: >-
        An interim hypothesis; later deltas and the next transcript.final
        supersede it. Deltas are never empty — empty interim hypotheses are
        dropped at normalization, never forwarded.
      properties:
        type:
          type: string
          enum:
            - transcript.delta
        text:
          type: string
      required:
        - type
        - text
      additionalProperties: false
    STTTranscriptFinal:
      type: object
      description: >-
        A finalized span of transcript with optional time-aligned segments.
        text may be empty: a finalized span of silence is legitimate.
      properties:
        type:
          type: string
          enum:
            - transcript.final
        text:
          type: string
        segments:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptSegment"
        speaker:
          type: string
          description: >-
            Whoever said the whole finalized span, present only when the
            session asked for diarization and the provider attributed the
            turn. Most providers report one speaker per finalized turn
            rather than per span, so this is where a diarized session
            usually reads its labels; per-span attribution rides
            segments[].speaker instead. The vendor's own label, verbatim.
      required:
        - type
        - text
      additionalProperties: false
    STTUsageUpdated:
      type: object
      description: >-
        Cumulative usage while the stream is live, so callers can watch spend
        before the terminal frame.
      properties:
        type:
          type: string
          enum:
            - usage.updated
        usage:
          $ref: "#/components/schemas/Usage"
      required:
        - type
        - usage
      additionalProperties: false
    STTSessionClosed:
      type: object
      description: The clean terminal frame carrying final usage.
      properties:
        type:
          type: string
          enum:
            - session.closed
        usage:
          $ref: "#/components/schemas/Usage"
      required:
        - type
        - usage
      additionalProperties: false
    TTSSessionConfigure:
      type: object
      description: >-
        Opens a streaming synthesis session. audio is the requested output
        format of the binary frames the server will send. The exact frame
        bytes are the session's idempotency content hash; later frames are
        intentionally outside the hash.
      properties:
        type:
          type: string
          enum:
            - session.configure
        routing:
          $ref: "#/components/schemas/Routing"
          description: >-
            Omitted entirely, routing means {mode: auto, objective: balanced}.
        voice:
          type: string
          description: >-
            Optional: in auto mode the party that picks the provider picks a
            default voice for it.
        language:
          type: string
          description: >-
            Optional language hint. Auto routing ranks candidates on that
            language's benchmark board and the Router picks a voice curated
            for it; omitted means English.
        audio:
          $ref: "#/components/schemas/AudioConfig"
      required:
        - type
        - audio
      additionalProperties: false
    TTSInputAppend:
      type: object
      description: >-
        Adds text to the utterance being assembled. Characters are counted
        against the reserved budget when appended, so an over-budget append
        fails before any provider work happens.
      properties:
        type:
          type: string
          enum:
            - input.append
        text:
          type: string
      required:
        - type
        - text
      additionalProperties: false
    TTSInputCommit:
      type: object
      description: >-
        Finalizes the appended text as one utterance and starts synthesis.
      properties:
        type:
          type: string
          enum:
            - input.commit
      required:
        - type
      additionalProperties: false
    TTSInputCancel:
      type: object
      description: >-
        Abandons uncommitted appended text and any in-flight synthesis for the
        current utterance.
      properties:
        type:
          type: string
          enum:
            - input.cancel
      required:
        - type
      additionalProperties: false
    TTSSessionClose:
      type: object
      description: >-
        Asks the server to finish outstanding synthesis and end the session
        with a terminal session.closed frame.
      properties:
        type:
          type: string
          enum:
            - session.close
      required:
        - type
      additionalProperties: false
    TTSSessionReady:
      type: object
      description: >-
        Confirms admission and reports the concrete route. It is always the
        first event frame; the client must not append text before it.
      properties:
        type:
          type: string
          enum:
            - session.ready
        request_id:
          type: string
        route:
          $ref: "#/components/schemas/Route"
      required:
        - type
        - request_id
        - route
      additionalProperties: false
    TTSUtteranceStarted:
      type: object
      description: >-
        Announces the binary audio frames for one committed utterance.
        sequence is the 1-based utterance index within the session so clients
        can correlate audio with commits.
      properties:
        type:
          type: string
          enum:
            - utterance.started
        sequence:
          type: integer
          minimum: 1
      required:
        - type
        - sequence
      additionalProperties: false
    TTSUtteranceDone:
      type: object
      description: Marks the end of one utterance's binary audio frames.
      properties:
        type:
          type: string
          enum:
            - utterance.done
        sequence:
          type: integer
          minimum: 1
      required:
        - type
        - sequence
      additionalProperties: false
    TTSUsageUpdated:
      type: object
      description: >-
        Cumulative usage while the stream is live, so callers can watch spend
        before the terminal frame.
      properties:
        type:
          type: string
          enum:
            - usage.updated
        usage:
          $ref: "#/components/schemas/Usage"
      required:
        - type
        - usage
      additionalProperties: false
    TTSSessionClosed:
      type: object
      description: The clean terminal frame carrying final usage.
      properties:
        type:
          type: string
          enum:
            - session.closed
        usage:
          $ref: "#/components/schemas/Usage"
      required:
        - type
        - usage
      additionalProperties: false
    S2SAudioConfig:
      type: object
      description: >-
        Both directions of a speech-to-speech session: the raw binary frames
        the client sends and the raw binary frames it wants back. They may
        differ — most models listen and speak at different rates. Each model's
        accepted input and spoken output formats are advertised by GET
        /v1/models as audio_formats and output_audio_formats.
      properties:
        input:
          $ref: "#/components/schemas/AudioConfig"
        output:
          $ref: "#/components/schemas/AudioConfig"
      required:
        - input
        - output
      additionalProperties: false
    S2SSessionConfigure:
      type: object
      description: >-
        Opens a speech-to-speech session. Voice, language, instructions and
        temperature are session intent: they ride this frame and the
        idempotency hash, and later frames cannot change them.
      properties:
        type:
          type: string
          enum:
            - session.configure
        routing:
          $ref: "#/components/schemas/Routing"
          description: >-
            Omitted entirely, routing means {mode: auto, objective: balanced}.
        audio:
          $ref: "#/components/schemas/S2SAudioConfig"
        language:
          type: string
          description: >-
            Optional language hint. Auto routing ranks candidates on that
            language's benchmark board and the Router picks a voice curated
            for it.
        voice:
          type: string
          description: >-
            Optional: in auto mode the party that picks the provider picks a
            default voice for it.
        instructions:
          type: string
          maxLength: 32768
          description: >-
            The system prompt the model speaks under. Customer content; the
            bound is 32 KiB of UTF-8 and is normative here in prose — JSON
            Schema counts code points.
        temperature:
          type: number
          minimum: 0
          maximum: 2
          description: Sampling temperature; omitted leaves the vendor default.
      required:
        - type
        - audio
      additionalProperties: false
    S2SInputCommit:
      type: object
      description: >-
        Tells the model the caller finished speaking. A hint: every routed
        model also detects turn ends on its own.
      properties:
        type:
          type: string
          enum:
            - input.commit
      required:
        - type
      additionalProperties: false
    S2SResponseCancel:
      type: object
      description: >-
        Interrupts the answer being spoken (barge-in). Audio already delivered
        stays delivered and billed.
      properties:
        type:
          type: string
          enum:
            - response.cancel
      required:
        - type
      additionalProperties: false
    S2SSessionClose:
      type: object
      description: Asks the server to end the session with a terminal session.closed frame.
      properties:
        type:
          type: string
          enum:
            - session.close
      required:
        - type
      additionalProperties: false
    S2SSessionReady:
      type: object
      description: >-
        Confirms admission and reports the concrete route. It is always the
        first event frame; the client must not send audio before it.
      properties:
        type:
          type: string
          enum:
            - session.ready
        request_id:
          type: string
        route:
          $ref: "#/components/schemas/Route"
      required:
        - type
        - request_id
        - route
      additionalProperties: false
    S2SInputSpeechStarted:
      type: object
      description: The model detected the caller speaking.
      properties:
        type:
          type: string
          enum:
            - input.speech_started
      required:
        - type
      additionalProperties: false
    S2SInputSpeechEnded:
      type: object
      description: The model detected the end of the caller's turn.
      properties:
        type:
          type: string
          enum:
            - input.speech_ended
      required:
        - type
      additionalProperties: false
    S2SInputTranscript:
      type: object
      description: >-
        The model's transcription of what the caller said. final marks a
        completed span; a non-final transcript is an interim hypothesis
        superseded by later frames and is never empty. A final transcript may
        be empty: a finalized span of silence is legitimate.
      properties:
        type:
          type: string
          enum:
            - input.transcript
        text:
          type: string
        final:
          type: boolean
      required:
        - type
        - text
        - final
      additionalProperties: false
    S2SResponseStarted:
      type: object
      description: >-
        Announces the binary audio frames of one spoken answer. sequence is
        the 1-based answer index within the session.
      properties:
        type:
          type: string
          enum:
            - response.started
        sequence:
          type: integer
          minimum: 1
      required:
        - type
        - sequence
      additionalProperties: false
    S2SResponseTranscriptDelta:
      type: object
      description: A piece of the text of the answer being spoken; never empty.
      properties:
        type:
          type: string
          enum:
            - response.transcript.delta
        sequence:
          type: integer
          minimum: 1
        text:
          type: string
      required:
        - type
        - sequence
        - text
      additionalProperties: false
    S2SResponseDone:
      type: object
      description: Marks the end of one answer's binary audio frames.
      properties:
        type:
          type: string
          enum:
            - response.done
        sequence:
          type: integer
          minimum: 1
      required:
        - type
        - sequence
      additionalProperties: false
    S2SResponseCancelled:
      type: object
      description: >-
        An answer stopped before it finished because the caller interrupted
        it (barge-in or response.cancel). No response.done follows for that
        sequence.
      properties:
        type:
          type: string
          enum:
            - response.cancelled
        sequence:
          type: integer
          minimum: 1
      required:
        - type
        - sequence
      additionalProperties: false
    S2SUsageUpdated:
      type: object
      description: >-
        Cumulative usage while the session is live. For s2s, duration_ms is
        connected wall-clock time so far.
      properties:
        type:
          type: string
          enum:
            - usage.updated
        usage:
          $ref: "#/components/schemas/Usage"
      required:
        - type
        - usage
      additionalProperties: false
    S2SSessionClosed:
      type: object
      description: The clean terminal frame carrying final usage.
      properties:
        type:
          type: string
          enum:
            - session.closed
        usage:
          $ref: "#/components/schemas/Usage"
      required:
        - type
        - usage
      additionalProperties: false
