[project]
name = "speko-gateway"
version = "0.1.0"
description = "LiveKit integration for the local Speko Gateway"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = ["aiohttp>=3.10,<4"]

[project.optional-dependencies]
livekit = ["livekit-agents>=1.6.1,<2"]
dev = [
  "livekit-agents>=1.6.1,<2",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88

